apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qdrant-es-gateway.fullname" . }}
  labels:
    {{- include "qdrant-es-gateway.labels" . | nindent 4 }}
data:
  LISTEN_ADDR: 0.0.0.0:9200
  QDRANT_URL: {{ .Values.qdrant.url | quote }}
  QDRANT_REPLICATION_FACTOR: {{ .Values.qdrant.replicationFactor | quote }}
  LOG_LEVEL: {{ .Values.gateway.logLevel | quote }}
  ES_COMPAT_VERSION: {{ .Values.gateway.esCompatVersion | quote }}
  COMPATIBILITY_ANALYTICS: {{ .Values.gateway.compatibilityAnalytics | quote }}
  DOCUMENT_PROJECTION: {{ .Values.gateway.documentProjection | quote }}
  ASYNC_SEARCH_PROJECTION: {{ .Values.gateway.asyncSearchProjection | quote }}
  ASYNC_PAYLOAD_WRITES: {{ .Values.gateway.asyncPayloadWrites | quote }}
  MAX_BODY_BYTES: {{ .Values.gateway.maxBodyBytes | quote }}
  MAX_BULK_BYTES: {{ .Values.gateway.maxBulkBytes | quote }}
  MAX_PAGE_SIZE: {{ .Values.gateway.maxPageSize | quote }}
