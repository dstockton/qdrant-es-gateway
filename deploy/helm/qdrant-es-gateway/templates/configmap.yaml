{{- if .Values.readCache.deployment }}
{{- if not .Values.catalog.existingSecret }}
{{- fail "readCache requires catalog.existingSecret" }}
{{- end }}
{{- if or .Values.gateway.asyncPayloadWrites .Values.gateway.asyncSearchProjection }}
{{- fail "readCache requires both asynchronous write modes disabled" }}
{{- end }}
{{- if ne (toString .Values.qdrant.replicationFactor) "1" }}
{{- fail "readCache requires qdrant.replicationFactor=1" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qdrant-es-gateway.fullname" . }}
  labels:
    {{- include "qdrant-es-gateway.labels" . | nindent 4 }}
data:
  LISTEN_ADDR: 0.0.0.0:9200
  QDRANT_URL: {{ .Values.qdrant.url | quote }}
  QDRANT_REPLICATION_FACTOR: {{ .Values.qdrant.replicationFactor | quote }}
  LOG_LEVEL: {{ .Values.gateway.logLevel | quote }}
  ES_COMPAT_VERSION: {{ .Values.gateway.esCompatVersion | quote }}
  COMPATIBILITY_ANALYTICS: {{ .Values.gateway.compatibilityAnalytics | quote }}
  DOCUMENT_PROJECTION: {{ .Values.gateway.documentProjection | quote }}
  ASYNC_SEARCH_PROJECTION: {{ .Values.gateway.asyncSearchProjection | quote }}
  ASYNC_PAYLOAD_WRITES: {{ .Values.gateway.asyncPayloadWrites | quote }}
  QDRANT_CONNECT_TIMEOUT_MS: {{ .Values.gateway.qdrantConnectTimeoutMs | quote }}
  QDRANT_REQUEST_TIMEOUT_MS: {{ .Values.gateway.qdrantRequestTimeoutMs | quote }}
  ASYNC_WRITE_QUEUE: {{ .Values.gateway.asyncWriteQueue | quote }}
  MAX_BODY_BYTES: {{ .Values.gateway.maxBodyBytes | quote }}
  MAX_BULK_BYTES: {{ .Values.gateway.maxBulkBytes | quote }}
  MAX_PAGE_SIZE: {{ .Values.gateway.maxPageSize | quote }}
  {{- if .Values.readCache.deployment }}
  READ_CACHE_DEPLOYMENT: {{ .Values.readCache.deployment | quote }}
  READ_CACHE_SERVE: {{ .Values.readCache.serve | quote }}
  READ_CACHE_TTL_SECONDS: {{ .Values.readCache.ttlSeconds | quote }}
  READ_CACHE_MAX_BYTES: {{ .Values.readCache.maxBytes | quote }}
  {{- end }}
