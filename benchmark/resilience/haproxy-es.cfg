global
  maxconn 2048
defaults
  mode http
  timeout connect 2s
  timeout client 60s
  timeout server 60s
frontend es_frontend
  bind *:9200
  default_backend es_nodes
backend es_nodes
  option httpchk GET /_cluster/health
  balance roundrobin
  server es1 es1:9200 check
  server es2 es2:9200 check
  server es3 es3:9200 check
