global
  maxconn 2048
defaults
  mode http
  timeout connect 2s
  timeout client 60s
  timeout server 60s
frontend gateway_frontend
  bind *:9200
  default_backend gateway_nodes
backend gateway_nodes
  # Keep the gateway replicas in rotation while an upstream Qdrant node
  # recovers; /readyz is intentionally stricter and belongs to orchestration.
  option httpchk GET /healthz
  balance roundrobin
  server gateway1 gateway1:9200 check
  server gateway2 gateway2:9200 check
  server gateway3 gateway3:9200 check
