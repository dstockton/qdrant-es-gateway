global
  maxconn 2048
defaults
  mode http
  timeout connect 2s
  timeout client 60s
  timeout server 60s
frontend qdrant_frontend
  bind *:6333
  default_backend qdrant_nodes
backend qdrant_nodes
  option httpchk GET /collections
  balance roundrobin
  server qdrant1 qdrant1:6333 check
  server qdrant2 qdrant2:6333 check
  server qdrant3 qdrant3:6333 check
