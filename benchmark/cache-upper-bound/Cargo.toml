[package]
name = "qeg-cache-upper-bound"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "qeg-cache-upper-bound"
path = "main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
redis = { version = "0.32", features = ["tokio-rustls-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
