[package]
name = "qdrant-es-gateway"
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"
description = "A deliberately useful Elasticsearch-compatible application-search gateway backed by Qdrant"

[features]
default = []
diagnostic-timing = []

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
chrono-tz = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
http = "1"
http-body-util = "0.1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
regex = "1"
redis = { version = "1.7", features = ["tokio-rustls-comp"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
