name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 scripts/export_agent_docs.py --check

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit

  rust:
    runs-on: ubuntu-24.04
    services:
      catalog:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --all-features
      - name: Verify catalog ownership and cache coordination
        env:
          CATALOG_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --bin qdrant-es-gateway -- --include-ignored
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Verify disposable cache publication across crashes and AOF rewrites
        run: python3 tests/cache_ephemeral_aof.py --image valkey/valkey:9.1.2-alpine --expected-version 9.1.2 --output "$RUNNER_TEMP/cache-ephemeral-aof.json"

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint deploy/helm/qdrant-es-gateway
      - run: helm template smoke deploy/helm/qdrant-es-gateway >/dev/null
      - name: Verify coordinated cache configuration
        run: |
          helm template smoke deploy/helm/qdrant-es-gateway --set readCache.deployment=ci --set catalog.existingSecret=valkey --set qdrant.replicationFactor=1 --set gateway.asyncPayloadWrites=false --set gateway.asyncSearchProjection=false >/dev/null
          if helm template smoke deploy/helm/qdrant-es-gateway --set readCache.deployment=ci >/dev/null 2>&1; then
            echo "Unsafe cache configuration unexpectedly rendered"
            exit 1
          fi
      - name: Keep the SQLite-backed default single-replica
        run: |
          helm template smoke deploy/helm/qdrant-es-gateway --show-only templates/deployment.yaml | grep -q '^  replicas: 1$'

  container:
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: qdrant-es-gateway:ci
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qdrant-es-gateway:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-image.sarif
      - name: Enforce image vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qdrant-es-gateway:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true
      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          artifact-name: source-sbom.spdx.json
          upload-artifact: true
