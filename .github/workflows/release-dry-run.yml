name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE: qdrant-es-gateway:release-dry-run

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        name: Validate package and chart versions
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' Cargo.toml | head -n1)"
          chart_version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' deploy/helm/qdrant-es-gateway/Chart.yaml | head -n1)"
          test -n "${version}" && test "${version}" = "${chart_version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image without pushing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image without publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Package Helm chart without publishing
        run: helm package deploy/helm/qdrant-es-gateway --version "${{ needs.validate.outputs.version }}" --app-version "${{ needs.validate.outputs.version }}"
